# KEDA ScaledObject: Notification Service
#
# Scales based on RabbitMQ queue depth instead of CPU.
#
# Why this is better than HPA for notification-service:
#   - Notification-service processes emails from a queue
#   - CPU stays low even with 10,000 pending messages (I/O bound)
#   - HPA would never scale up because CPU < threshold
#   - KEDA sees the queue growing and adds pods to drain it faster
#
# Behavior:
#   - 0 messages → scale to 0 (save resources when idle)
#   - 1-50 messages → 1 pod
#   - 50-200 messages → 2-4 pods (linear scaling)
#   - 200+ messages → max 6 pods
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notification-service-scaler
  namespace: piggymetrics
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: piggymetrics
    app.kubernetes.io/managed-by: keda
spec:
  scaleTargetRef:
    name: notification-service
  pollingInterval: 15           # Check queue every 15s
  cooldownPeriod: 120           # Wait 2 min before scaling down
  minReplicaCount: 0            # Scale to zero when queue empty!
  maxReplicaCount: 6
  fallback:
    replicas: 1                 # If KEDA can't reach RabbitMQ, keep 1 pod
    failureThreshold: 3
  triggers:
    - type: rabbitmq
      metadata:
        host: "amqp://guest:guest@rabbitmq.piggymetrics.svc.cluster.local:5672/"
        queueName: notifications
        mode: QueueLength
        value: "50"             # 1 pod per 50 messages in queue
      authenticationRef:
        name: rabbitmq-trigger-auth
  advanced:
    restoreToOriginalReplicaCount: false
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300   # 5 min stabilization before scale-down
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0     # Scale up immediately
          policies:
            - type: Pods
              value: 2
              periodSeconds: 30             # Add max 2 pods per 30s
---
# TriggerAuthentication for RabbitMQ credentials
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-trigger-auth
  namespace: piggymetrics
spec:
  secretTargetRef:
    - parameter: host
      name: piggymetrics-rabbitmq-credentials
      key: RABBITMQ_URI
